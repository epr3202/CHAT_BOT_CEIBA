services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ceiba
      POSTGRES_USER: ceiba
      POSTGRES_PASSWORD: ceiba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceiba -d ceiba"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Compose environment overrides env_file so containers use the db service host.
      DATABASE_URL: postgresql+asyncpg://ceiba:ceiba@db:5432/ceiba
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Compose environment overrides env_file so containers use the db service host.
      DATABASE_URL: postgresql+asyncpg://ceiba:ceiba@db:5432/ceiba
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.channel.worker"]

volumes:
  postgres_data:
