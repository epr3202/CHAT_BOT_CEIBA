services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceiba
      POSTGRES_USER: ceiba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceiba -d ceiba"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - /opt/ceiba/catalogs:/data/catalogs
      - /opt/ceiba/payment-evidence:/data/payment-evidence
      - /opt/ceiba/secrets:/data/secrets:ro
    environment:
      # Compose environment overrides env_file so containers use the db service host.
      DATABASE_URL: postgresql+asyncpg://ceiba:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/ceiba
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - /opt/ceiba/catalogs:/data/catalogs:ro
      - /opt/ceiba/payment-evidence:/data/payment-evidence
      - /opt/ceiba/secrets:/data/secrets:ro
    environment:
      # Compose environment overrides env_file so containers use the db service host.
      DATABASE_URL: postgresql+asyncpg://ceiba:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/ceiba
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.channel.worker"]

  admin:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /srv/frontend
    volumes:
      - ./frontend:/srv/frontend:ro
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "5173"
      API_BASE_URL: http://app:8000
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - app
    command: ["node", "server.mjs"]

volumes:
  postgres_data:
