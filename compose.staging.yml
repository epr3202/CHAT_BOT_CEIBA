# A1 infrastructure only. Never combine with the local development profile.
name: ceiba-staging
services:
  db:
    extends:
      file: compose.postgres.yml
      service: db
    networks: [database]
  tls:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./infra/staging/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${STAGING_TLS_CERT:?external certificate file required}
        target: /run/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STAGING_TLS_KEY:?external private key file required}
        target: /run/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [edge]
    healthcheck:
      test: [CMD-SHELL, 'wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/infra-health']
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  database:
    internal: true
  edge:
volumes:
  postgres_data:
