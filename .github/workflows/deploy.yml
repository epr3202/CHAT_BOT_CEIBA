name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ceiba
          POSTGRES_USER: ceiba
          POSTGRES_PASSWORD: ceiba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceiba -d ceiba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ceiba:ceiba@localhost:5432/ceiba_test
      TEST_DATABASE_URL: postgresql+asyncpg://ceiba:ceiba@localhost:5432/ceiba_test
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      META_APP_SECRET: test
      META_VERIFY_TOKEN: test
      META_ACCESS_TOKEN: test
      META_PHONE_NUMBER_ID: test
      META_GRAPH_API_VERSION: v20.0
      WEBHOOK_MAX_BODY_BYTES: "1048576"
      OUTBOX_POLL_INTERVAL_SECONDS: "0.01"
      OUTBOX_BATCH_SIZE: "10"
      OUTBOX_SENDING_TIMEOUT_SECONDS: "120"
      OUTBOX_MAX_ATTEMPTS: "5"
      OUTBOX_MAX_BACKOFF_SECONDS: "300"
      OPENROUTER_API_KEY: test
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_TIMEOUT_SECONDS: "15"
      OPENROUTER_MAX_RETRIES: "1"
      AI_CONFIDENCE_SAFE: "0.85"
      AI_CONFIDENCE_PROBABLE: "0.70"
      AI_CONFIDENCE_UNCERTAIN: "0.50"
      ENVIRONMENT: testing
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create test database
        run: |
          PGPASSWORD=ceiba psql -h localhost -U ceiba -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'ceiba_test'" | grep -q 1 \
            || PGPASSWORD=ceiba psql -h localhost -U ceiba -d postgres -c "CREATE DATABASE ceiba_test"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # accept-new records the host key on first contact without adding a fifth secret.
          # Production should rotate the VPS host key deliberately and review this workflow if it changes.
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && ./deploy.sh"
