name: CI (deployment is a separate authorized pass)

on:
  push:
    branches:
      - main
      - 'fix/a1-staging-provisioning-*'
  pull_request:

permissions:
  contents: read

jobs:
  staging-regressions:
    if: startsWith(github.ref, 'refs/heads/fix/a1-staging-provisioning-') || startsWith(github.head_ref, 'fix/a1-staging-provisioning-')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        stage: [regressions, suite]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse attested R11 runner and full collection
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python scripts/quality/r11/run_ci.py '${{ matrix.stage }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a1-${{ matrix.stage }}-${{ github.sha }}
          path: quality-output/${{ matrix.stage }}/
          if-no-files-found: error
          retention-days: 7
  staging-infrastructure:
    if: startsWith(github.ref, 'refs/heads/fix/a1-staging-provisioning-') || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify disposable staging infrastructure
        run: python -m scripts.quality.staging_ci
  test:
    if: ${{ !startsWith(github.ref, 'refs/heads/fix/a1-staging-provisioning-') && !startsWith(github.head_ref, 'fix/a1-staging-provisioning-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ceiba
          POSTGRES_USER: ceiba
          POSTGRES_PASSWORD: ceiba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceiba -d ceiba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ceiba:ceiba@localhost:5432/ceiba_test
      TEST_DATABASE_URL: postgresql+asyncpg://ceiba:ceiba@localhost:5432/ceiba_test
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      META_APP_SECRET: test
      META_VERIFY_TOKEN: test
      META_ACCESS_TOKEN: test
      META_PHONE_NUMBER_ID: test
      META_GRAPH_API_VERSION: v20.0
      WEBHOOK_MAX_BODY_BYTES: "1048576"
      OUTBOX_POLL_INTERVAL_SECONDS: "0.01"
      OUTBOX_BATCH_SIZE: "10"
      OUTBOX_SENDING_TIMEOUT_SECONDS: "120"
      OUTBOX_MAX_ATTEMPTS: "5"
      OUTBOX_MAX_BACKOFF_SECONDS: "300"
      OPENROUTER_API_KEY: test
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_TIMEOUT_SECONDS: "15"
      OPENROUTER_MAX_RETRIES: "1"
      AI_CONFIDENCE_SAFE: "0.85"
      AI_CONFIDENCE_PROBABLE: "0.70"
      AI_CONFIDENCE_UNCERTAIN: "0.50"
      ENVIRONMENT: testing
      DEPLOYED_RUNTIME: "false"
      PAYMENT_EVIDENCE_AUTOMATION_ENABLED: "true"
      CALENDAR_WRITES_ENABLED: "true"
      CALENDAR_ADAPTER: fake
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Create test database
        run: |
          PGPASSWORD=ceiba psql -h localhost -U ceiba -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'ceiba_test'" | grep -q 1 \
            || PGPASSWORD=ceiba psql -h localhost -U ceiba -d postgres -c "CREATE DATABASE ceiba_test"

      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-ci.lock

      - name: Lint
        run: ruff check app tests scripts

      - name: Migration cycle
        run: make migrate-cycle PYTHON=python

      - name: Test
        env:
          QUALITY_STAGE: suite
        run: python -m pytest -q

      - name: Node regression tests
        run: node --test tests/remediation/r10/simulator.test.mjs tests/remediation/r11/frontend.test.mjs
