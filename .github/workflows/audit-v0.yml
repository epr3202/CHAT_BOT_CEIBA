name: Audit V0 failure diagnosis
on:
  push:
    branches: ['audit/v0-ci-*']
permissions:
  contents: read
concurrency:
  group: audit-v0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/audit/v0-ci-')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        stage: [diagnostic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute isolated audit stage
        id: validation
        continue-on-error: true
        run: python docs/audits/2026-09-07-8935687-v0-diagnostico/run_ci.py '${{ matrix.stage }}'
      - name: Upload synthetic evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-v0-diagnosis-${{ matrix.stage }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: audit-output/${{ matrix.stage }}/
          if-no-files-found: error
          retention-days: 3
      - name: Required result gate
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          STAGE: ${{ matrix.stage }}
        run: |
          test "$VALIDATION_OUTCOME" = success
          test -s "audit-output/$STAGE/stage_summary.json"
          test -s "audit-output/$STAGE/host_manifest.json"
